services:
  - type: web
    name: erepair-api
    runtime: docker
    plan: free
    dockerfilePath: ./deployment/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EREPAIR_DEPLOYMENT_TARGET
        value: render
      - key: EREPAIR_SINGLE_INSTANCE
        value: "true"
      - key: EREPAIR_DURABLE_FILES
        value: "true"
      - key: EREPAIR_FILE_QUOTA_MB
        value: "128"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: verify-full
      - key: DB_SSLROOTCERT
        value: /etc/ssl/certs/ca-certificates.crt
      - key: CACHE_STORE
        value: database
      - key: CACHE_LIMITER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_MAILER
        value: brevo-http
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: eRepair
      - key: EREPAIR_ADMIN_NAME
        sync: false
      - key: EREPAIR_ADMIN_EMAIL
        sync: false
      - key: EREPAIR_ADMIN_PASSWORD
        sync: false
